[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskeval"
version = "0.1.0"
description = "Honest evaluation of binary risk models: intervals, calibration, cost-based thresholds, drift and slices, in one offline HTML report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]
cases = ["lightgbm>=4"]

[project.scripts]
riskeval = "riskeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: simulation tests that take more than a few seconds"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/riskeval/report.py" = ["E501"]  # inline SVG and CSS strings
